<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive component check</title><style>body{margin:0;padding:16px;background:#deded8;font:14px sans-serif}nav{display:flex;gap:12px;margin-bottom:15px}iframe{display:block;height:850px;border:0;background:white;margin:auto}select{padding:8px}</style></head><body><nav><label>Component <select id="page"><option value="dashboard.html#account">Customer dashboard</option><option value="studio.html#labels">Admin labels</option><option value="studio.html#reviews">Admin reviews</option><option value="studio.html#privacy">Policy editor</option></select></label><label>Width <select id="width"><option value="390">390px mobile</option><option value="768">768px tablet</option><option value="1200">1200px desktop</option></select></label></nav><iframe title="Responsive fixture" src="dashboard.html#account" width="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#page').onchange=e=>frame.src=e.target.value;document.querySelector('#width').onchange=e=>frame.width=e.target.value;</script></body></html>
